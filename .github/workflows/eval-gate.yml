name: eval-gate

# PR-blocking Week 2 eval gate. Runs the SAME offline rubric suite as the
# local pre-push hook (agent/gate/) on every push and pull request. The
# gate makes no live API calls (the live suite is agent/evals/, not run
# here), so no secrets are needed. A failing rubric test fails the job and
# blocks the merge when branch protection requires this check.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt

      - name: Run offline eval gate
        run: python -m pytest agent/gate -q -p no:cacheprovider
