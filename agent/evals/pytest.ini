[pytest]
asyncio_mode = auto
python_files = test_*.py
# Two known-benign warnings this suite always triggers, silenced so
# run_evals.py's output stays a clean pass/fail table:
#   - starlette's TestClient warns that its httpx-based transport is
#     deprecated in favor of a separate "httpx2" package that does not
#     exist as a stable release yet; nothing to migrate to today.
#   - pytest's own collector warns about `schemas.TestingRecord` (a
#     Pydantic model, not a test class) purely because its name starts
#     with "Test" -- it correctly declines to collect it either way.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
    ignore:cannot collect test class 'TestingRecord':UserWarning
